<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f6f8">
<script>/* 主题要在样式生效前定好，否则会先闪一下深色 */
try{document.documentElement.setAttribute("data-theme",localStorage.getItem("astock-theme")||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

<title>登录 · A-SHARE WATCHDESK</title>
<style>
  /* 配色沿用 index.html 的 token，登录页和看板是同一套视觉 */
  :root{
    --bg:#0a0d12; --panel:#12171f; --line:#212b38; --line2:#2c3846;
    --txt:#cdd6e0; --muted:#6b7686; --dim:#4b5563;
    --gold:#e0a92e; --gold-dim:#8a6d24; --up:#ff4d5e;
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 78% -8%, rgba(224,169,46,.06), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(34,201,139,.05), transparent 55%),
      var(--bg);
    color:var(--txt); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 85%)}
  .card{position:relative;z-index:1;width:100%;max-width:380px;
    background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:32px 28px}
  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 12px var(--up);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sub{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:3px;margin-top:6px;text-transform:uppercase}
  form{margin-top:26px;display:flex;flex-direction:column;gap:14px}
  label{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase}
  input{width:100%;background:#0d1219;border:1px solid var(--line2);border-radius:8px;
    color:var(--txt);font-family:var(--mono);font-size:14px;padding:11px 13px;outline:none}
  input:focus{border-color:var(--gold-dim)}
  input::placeholder{color:var(--dim)}
  button{margin-top:6px;background:var(--gold);color:#1a1206;border:0;border-radius:8px;
    font-weight:700;font-size:14px;padding:12px;cursor:pointer;font-family:var(--sans)}
  button:hover{filter:brightness(1.1)}
  .err{background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.35);color:#ff8a95;
    border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:18px}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--dim);line-height:1.7}
</style>
<link rel="stylesheet" href="/static/theme.css">
<script src="/static/theme.js" defer></script>

</head>
<body>
  <div class="card">
    <button class="btn themebtn" id="themeBtn" type="button"
            style="position:absolute;top:14px;right:14px">深色</button>
    <div class="brand"><span class="dot"></span>观察台</div>
    <div class="sub">A-Share Watchdesk</div>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="post" action="/login?next={{ next|urlencode }}">
      <div>
        <label for="uid">用户名</label>
        <input id="uid" name="uid" autocomplete="username" autocapitalize="none"
               autocorrect="off" spellcheck="false" required autofocus>
      </div>
      <div>
        <label for="password">密码</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit">进入</button>
    </form>

    <div class="foot">
      仅供研究，不构成投资建议。<br>
      每个账号的自选股、持仓、画像与笔记相互独立。
    </div>
  </div>
</body>
</html>
